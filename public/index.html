<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Website launch</title>
<style>
  :root{--bg:#f6f4ee;--ink:#1d2a24;--mute:#5e6b64;--card:#fff;--line:#d9d5c8;--go:#1f6b4a;--go-ink:#fff;--bad:#a3322b;--ok:#e3f1e8}
  @media (prefers-color-scheme:dark){:root{--bg:#141a17;--ink:#eef1ec;--mute:#9aa8a0;--card:#1c2420;--line:#2f3a34;--go:#4cbf8b;--go-ink:#0c1a13;--bad:#ff8d84;--ok:#1d3a2b}}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,"Times New Roman",serif;display:grid;place-items:center;padding:24px}
  main{width:100%;max-width:560px}
  h1{font-size:2rem;line-height:1.15;margin:0 0 8px;font-weight:600}
  p{margin:0 0 16px;color:var(--mute)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;margin-top:24px}
  label{font:600 15px system-ui,sans-serif;display:block;margin-bottom:6px}
  input{font:1rem system-ui,sans-serif;width:100%;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:14px}
  input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .meta{font:15px/1.5 system-ui,sans-serif;margin:0 0 20px;color:var(--mute)}
  .meta b{color:var(--ink);font-weight:600}
  button,.btn{font:600 1.1rem system-ui,sans-serif;border:0;border-radius:8px;padding:16px 24px;width:100%;cursor:pointer;background:var(--go);color:var(--go-ink);text-align:center;display:block;text-decoration:none}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.6;cursor:wait}
  .launch{padding:22px 24px;font-size:1.3rem}
  .link{background:none;color:var(--ink);border:1px solid var(--line);margin-bottom:12px;font-size:1rem;padding:12px}
  .note{font:15px system-ui,sans-serif;padding:12px 14px;border-radius:8px;background:var(--ok);margin-bottom:16px}
  .err{color:var(--bad);font:15px system-ui,sans-serif;margin-top:12px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1 id="title">Website launch</h1>
  <p id="sub">Enter the launch password to continue.</p>

  <section class="card" id="login">
    <label for="pw">Launch password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button id="checkBtn">Continue</button>
  </section>

  <section class="card" id="panel" hidden>
    <div class="note" id="note" hidden></div>
    <p class="meta" id="info"></p>
    <a class="btn link" id="preview" target="_blank" rel="noopener" hidden>Preview the new website first</a>
    <button class="launch" id="launchBtn">Launch the new website</button>
  </section>

  <p class="err" id="err" role="alert" hidden></p>
</main>

<script>
const SCHOOL = "Our School"; // change to your school's name
const $ = id => document.getElementById(id);
let password = "", data = null;

document.title = SCHOOL + " – Website launch";
$("title").textContent = SCHOOL + " website launch";

const when = iso => new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
const fail = m => { $("err").textContent = m; $("err").hidden = false; };

async function call(action){
  const r = await fetch("/api/launch", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ password, action })
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong (" + r.status + ").");
  return j;
}

async function check(){
  $("err").hidden = true;
  password = $("pw").value;
  if (!password) return fail("Enter the launch password.");
  const b = $("checkBtn"); b.disabled = true; b.textContent = "Checking…";
  try{
    data = await call("status");
    $("login").hidden = true; $("panel").hidden = false;
    if (!data.ready){
      $("sub").textContent = "Nothing is ready to launch yet.";
      $("info").textContent = "There is no finished build of the website. Ask your web developer to prepare one.";
      $("launchBtn").hidden = true; return;
    }
    $("preview").href = data.preview; $("preview").hidden = false;
    if (data.live){
      $("sub").textContent = "The newest version is already live.";
      $("note").textContent = "Live at " + data.address; $("note").hidden = false;
      $("info").textContent = "";
      $("launchBtn").hidden = true; return;
    }
    $("sub").textContent = "The new website is ready. Check the preview, then launch.";
    $("info").innerHTML = "Version to launch: <b>" + (data.title || "Latest update") + "</b><br>Prepared " +
      when(data.created_at) + "<br>It will go live at <b>" + data.address + "</b>";
  }catch(e){ fail(e.message); b.disabled = false; b.textContent = "Continue"; }
}

async function launch(){
  if (!confirm("Launch the new website for everyone to see?\n\nThis takes effect within seconds.")) return;
  const b = $("launchBtn"); b.disabled = true; b.textContent = "Launching…"; $("err").hidden = true;
  try{
    const j = await call("launch");
    $("sub").textContent = "The new website is live.";
    $("note").textContent = "Launched successfully."; $("note").hidden = false;
    $("info").innerHTML = "Visit it at <b>" + j.address + "</b>";
    $("preview").href = j.address; $("preview").textContent = "Open the live website";
    b.hidden = true;
  }catch(e){ fail(e.message); b.disabled = false; b.textContent = "Launch the new website"; }
}

$("checkBtn").onclick = check;
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
$("launchBtn").onclick = launch;
</script>
</body>
</html>
